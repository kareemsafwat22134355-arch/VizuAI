[project]
name = "monter-bridge"
version = "0.26.0"
description = "8GB-RAM-first local cinematic intelligence bridge for MONTER"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "orjson>=3.10,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "scenedetect-headless>=0.7.2,<0.8",
  "librosa>=1.0,<2",
  "soundfile>=0.13,<1",
  "opentimelineio>=0.18,<0.19"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
monter = "monter_bridge.cli:main"
monter-doctor = "monter_bridge.doctor:main"
monter-bundle = "monter_bridge.bundle:main"
monter-microscope = "monter_bridge.microscope_cli:microscope_main"
monter-style-profile = "monter_bridge.microscope_cli:style_profile_main"
monter-transition-opportunities = "monter_bridge.transition_cli:main"
monter-transition-refine = "monter_bridge.transition_refinement_cli:main"
monter-refined-compile = "monter_bridge.refined_compile_cli:main"
monter-audio-plan = "monter_bridge.audio_edit_cli:main"
monter-audio-render = "monter_bridge.audio_render_cli:main"
monter-sound-director = "monter_bridge.sound_director_cli:main"
monter-mix-audit = "monter_bridge.audio_mix_audit_cli:main"
monter-render-analyze = "monter_bridge.render_analysis_cli:main"
monter-correction = "monter_bridge.correction_cli:main"
monter-review = "monter_bridge.review_cli:review_main"
monter-review-summary = "monter_bridge.review_cli:summary_main"
monter-analysis-plan = "monter_bridge.advanced_analysis_cli:main"
monter-analysis-execute = "monter_bridge.advanced_executor_cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
