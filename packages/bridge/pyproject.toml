[project]
name = "monter-bridge"
version = "0.8.0"
description = "8GB-RAM-first local cinematic intelligence bridge for MONTER"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "orjson>=3.10,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "scenedetect-headless>=0.7.2,<0.8",
  "librosa>=1.0,<2",
  "soundfile>=0.13,<1",
  "opentimelineio>=0.18,<0.19"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
monter = "monter_bridge.cli:main"
monter-doctor = "monter_bridge.doctor:main"
monter-bundle = "monter_bridge.bundle:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
